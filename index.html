<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4Niz Explo - Jodhpur Tourism</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(120deg, hsl(40, 23%, 3%), #fff5e1);
      color: #4a2c2a;
    }

    header {
      background: #491111;
      color: #fff;
      padding: 40px 20px;
      text-align: center;
      font-family: 'Georgia', serif;
    }

    header h1 {
      font-size: 3rem;
      margin: 0;
      animation: fadeIn 2s ease-in-out;
    }

    header p {
      font-size: 1.2rem;
      margin-top: 10px;
      animation: slideUp 2s ease-in-out;
    }

    nav {
      background: #706e6e;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav a:hover {
      color: hsl(0, 0%, 0%);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    footer {
      background: lch(0.12% 1.24 303.05);
      color: #fff;
      text-align: center;
      padding: 15px;
      font-size: 0.9rem;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <header>
    <h1>4Niz Explo - Jodhpur Tourism</h1>
    <p>Experience the Royal Heritage of Rajasthan</p>
  </header>

  <nav>

    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>
